
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zepto Clone</title>
  <link rel="stylesheet" href="clone.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">zepto</div>
    <div class="search-box">
      <input type="text" placeholder="Search for groceries..." />
    </div>
    <div class="nav-actions">
      <button>Login</button>
      <button>Cart</button>
    </div>
  </div>

  <!-- Banner -->
  <div class="banner">
    <h1>Groceries in 10 Minutes ⚡</h1>
    <p>Fresh fruits, vegetables & daily essentials</p>
  </div>

  <!-- Categories -->
  <section class="categories">
    <h2>Shop by Category</h2>
    <div class="category-grid">
      <div class="category">Fruits</div>
      <div class="category">Vegetables</div>
      <div class="category">Dairy</div>
      <div class="category">Snacks</div>
    </div>
  </section>

  <!-- Products -->
  <section class="products">
  <h2>Popular Products</h2>

  <section class="product-grid">

    <section class="product">
      <img src="apple.jpg" alt="Apple">
      <h4>Apple</h4>
      <p class="price">₹120 / kg</p>
      <button>Add to Cart</button>
    </section>

    <section class="product">
      <img src="tomato.jpg" alt="Tomato">
      <h4>Tomato</h4>
      <p class="price">₹40 / kg</p>
      <button>Add to Cart</button>
    </section>

    <section class="product">
      <img src="milk.jpg" alt="Milk">
      <h4>Milk</h4>
      <p class="price">₹55 / litre</p>
      <button>Add to Cart</button>
    </section>

    <section class="product">
      <img src="bread.jpg" alt="Bread">
      <h4>Bread</h4>
      <p class="price">₹45</p>
      <button>Add to Cart</button>
    </section>

    <section class="product">
      <img src="chips.jpg" alt="Chips">
      <h4>Chips</h4>
      <p class="price">₹20</p>
      <button>Add to Cart</button>
    </section>

    <section class="product">
      <img src="dairymilk.jpg" alt="Dairymilk">
      <h4>Dairymilk</h4>
      <p class="price">₹90</p>
      <button>Add to Cart</button>
    </section>
  
    <section class="product">
      <img src="coke.jpg" alt="Thums Up">
      <h4>Thums Up</h4>
      <p class="price">₹20</p>
      <button>Add to Cart</button>
    </section>

    <section class="product">
      <img src="maggie.jpg" alt="Maggi">
      <h4>Maggi</h4>
      <p class="price">₹20</p>
      <button>Add to Cart</button>
    </section>


  


  </section>
</section>

  <footer>©️ 2026 Zepto Clone</footer>

</body>
</html>
